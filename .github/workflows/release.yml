name: release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - name: Skip if this version is already on npm
        id: check
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@maxwellcohen/wimb@$v" version >/dev/null 2>&1; then echo "already=true" >> "$GITHUB_OUTPUT"; echo "v$v already published, skipping"; fi
      - if: steps.check.outputs.already != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.already != 'true'
        run: pnpm build
      - if: steps.check.outputs.already != 'true'
        run: pnpm test
      - if: steps.check.outputs.already != 'true'
        run: pnpm --filter @maxwellcohen/wimb lint:pkg
      - if: steps.check.outputs.already != 'true'
        run: pnpm --filter @maxwellcohen/wimb publish --no-git-checks
