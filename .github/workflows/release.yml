name: release
on:
  push:
    branches: [main]
    paths: ["packages/cli/package.json"]
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - name: Skip if version already published
        id: check
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@maxwellcohen/wimb@$v" version >/dev/null 2>&1; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.publish == 'true'
        run: pnpm build
      - if: steps.check.outputs.publish == 'true'
        run: pnpm test
      - if: steps.check.outputs.publish == 'true'
        run: pnpm --filter @maxwellcohen/wimb lint:pkg
      - name: Stage publish (approve on npmjs.com with 2FA)
        if: steps.check.outputs.publish == 'true'
        run: |
          npm install -g npm@^11.15.0
          cd packages/cli && npm stage publish
