name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - name: Verify tag matches package version and main
        run: |
          [ "v$(node -p "require('./packages/cli/package.json').version")" = "$GITHUB_REF_NAME" ] || { echo "tag/version mismatch"; exit 1; }
          git fetch origin main && git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag not on main"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @maxwellcohen/wimb lint:pkg
      - run: pnpm --filter @maxwellcohen/wimb publish --no-git-checks
